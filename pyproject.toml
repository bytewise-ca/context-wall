[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "contextwall"
version = "0.2.1"
description = "Safety preflight and runtime firewall for AI agents — point at your agent, get a scorecard and release decision."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [
    { name = "ContextWall", email = "info@bytewise.ca" },
]
keywords = [
    "llm-security",
    "prompt-injection",
    "ai-agents",
    "ai-security",
    "agent-security",
    "rag",
    "guardrails",
    "llmops",
    "mcp",
    "preflight",
    "context-firewall",
]

dependencies = [
    # web framework
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    # mcp server
    "fastmcp>=2.0",
    # data validation
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    # database
    "aiosqlite>=0.19",
    "duckdb>=0.10",
    # scheduling & watching
    "apscheduler>=3.10",
    "watchdog>=3.0",
    # config
    "pyyaml>=6.0",
    # cli
    "click>=8.0",
    "rich>=13.0",
    "httpx>=0.27",
    "rapidfuzz>=3.0",
    # cryptographic signing for compliance bundles
    "cryptography>=42.0",
    # observability
    "prometheus-client>=0.20",
    # object storage archival
    "aiobotocore>=2.0",
]

[project.optional-dependencies]
# Provider SDKs — install the ones you use with contextwall.sdk wrappers.
anthropic = ["anthropic>=0.25"]
openai = ["openai>=1.0"]
all = ["anthropic>=0.25", "openai>=1.0"]

dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
    "httpx>=0.27",
    "anthropic>=0.25",
    "openai>=1.0",
]

[project.scripts]
ctxfw = "context_firewall.cli.main:cli"
ctxfwd = "context_firewall.daemon.main:main"
# Alias so `uvx contextwall <cmd>` works (executable name must match the
# package name for the implicit uvx invocation). Same entry point as ctxfw.
contextwall = "context_firewall.cli.main:cli"

[tool.hatch.build.targets.wheel]
packages = ["src/context_firewall"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
src = ["src"]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]
