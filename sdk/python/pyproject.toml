[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "contextwall-sdk"
version = "0.2.0"
description = "DEPRECATED — the ContextWall SDK now ships inside `contextwall`. This package is a thin shim that installs the main package and re-exports from `context_firewall.sdk`. Migrate to `pip install \"contextwall[all]\"`."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [
    { name = "ContextWall", email = "info@bytewise.ca" },
]
keywords = ["deprecated", "shim", "contextwall"]

# Bring the real implementation in, plus both provider SDKs — matches the
# old contextwall-sdk[all] behavior so pinned installs keep working.
dependencies = [
    "contextwall>=0.2.0",
    "anthropic>=0.25",
    "openai>=1.0",
]

[project.optional-dependencies]
# Kept for backward compatibility; extras now come from contextwall[*].
anthropic = ["contextwall[anthropic]>=0.2.0"]
openai = ["contextwall[openai]>=0.2.0"]
all = ["contextwall[all]>=0.2.0"]

[tool.hatch.build.targets.wheel]
packages = ["src/contextwall_sdk"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py311"
line-length = 100
